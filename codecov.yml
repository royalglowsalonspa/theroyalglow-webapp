codecov:
  # Mergify waits for coverage. Publish coverage independently so Codecov does
  # not wait for Mergify in return; CI Success remains a separate merge gate.
  require_ci_to_pass: false
  notify:
    wait_for_ci: false

coverage:
  precision: 2
  round: down
  range: 70..100
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 70%
        threshold: 2%

comment:
  layout: reach, diff, flags, files
  behavior: default
  require_changes: true
