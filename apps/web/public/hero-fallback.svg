<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1120" preserveAspectRatio="xMidYMid slice" role="presentation">
  <title>Royal Glow brand artwork</title>
  <defs>
    <linearGradient id="rg-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0f0a"/>
      <stop offset=".52" stop-color="#2d1810"/>
      <stop offset="1" stop-color="#1a0f0a"/>
    </linearGradient>
    <radialGradient id="rg-glow" cx=".8" cy=".18" r=".72">
      <stop offset="0" stop-color="#f4e09b" stop-opacity=".26"/>
      <stop offset=".42" stop-color="#c8a961" stop-opacity=".11"/>
      <stop offset="1" stop-color="#c8a961" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rg-depth" cx=".12" cy=".92" r=".7">
      <stop offset="0" stop-color="#d4c5a9" stop-opacity=".1"/>
      <stop offset="1" stop-color="#d4c5a9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rg-arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c8a961" stop-opacity="0"/>
      <stop offset=".55" stop-color="#c8a961" stop-opacity=".38"/>
      <stop offset="1" stop-color="#f4e09b" stop-opacity=".62"/>
    </linearGradient>
    <linearGradient id="rg-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4c5a9" stop-opacity=".3"/>
      <stop offset="1" stop-color="#d4c5a9" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="rg-vignette" cx=".5" cy=".5" r=".78">
      <stop offset=".55" stop-color="#1a0f0a" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a0f0a" stop-opacity=".6"/>
    </radialGradient>
  </defs>

  <rect width="1240" height="1120" fill="url(#rg-base)"/>
  <rect width="1240" height="1120" fill="url(#rg-glow)"/>
  <rect width="1240" height="1120" fill="url(#rg-depth)"/>

  <!-- Concentric halo arcs radiating from the warm highlight. -->
  <g fill="none" stroke="url(#rg-arc)" stroke-linecap="round">
    <circle cx="1010" cy="196" r="188" stroke-width="2"/>
    <circle cx="1010" cy="196" r="316" stroke-width="1.75"/>
    <circle cx="1010" cy="196" r="452" stroke-width="1.5"/>
    <circle cx="1010" cy="196" r="604" stroke-width="1.25"/>
    <circle cx="1010" cy="196" r="772" stroke-width="1"/>
  </g>

  <!-- Restrained gold geometry: a rotated square and a small solid marker. -->
  <g fill="none" stroke="#c8a961">
    <rect x="836" y="352" width="348" height="348" stroke-opacity=".22" stroke-width="1.5" transform="rotate(45 1010 526)"/>
    <circle cx="1010" cy="196" r="7" fill="#f4e09b" stroke="none" opacity=".7"/>
  </g>

  <!-- Editorial hairlines anchoring the lower-left calm zone. -->
  <g stroke="url(#rg-rule)" stroke-width="1.25">
    <line x1="96" y1="742" x2="612" y2="742"/>
    <line x1="96" y1="806" x2="424" y2="806"/>
  </g>

  <rect width="1240" height="1120" fill="url(#rg-vignette)"/>
  <rect x=".75" y=".75" width="1238.5" height="1118.5" fill="none" stroke="#c8a961" stroke-opacity=".16" stroke-width="1.5"/>
</svg>
