# ============================================================================
#  Deploy Admin Production — Admin portal (apps/admin → Cloudflare Workers / OpenNext)
#  Target: https://admin.theroyalglow.in   ·   Worker: rgss-admin
# ============================================================================
#
#  WHAT CHANGED (Pages → Workers / OpenNext migration)
#  ---------------------------------------------------
#  Previously this deployed `apps/admin/.next` to Cloudflare *Pages*
#  (`pages deploy`). Plain Pages cannot run the admin app's full SSR surface:
#  RBAC-gated pages, nonce-based CSP injected by edge middleware, realtime, and
#  Node-runtime API route handlers. We now build with the OpenNext adapter
#  (`@opennextjs/cloudflare`) and deploy the generated Worker
#  (`.open-next/worker.js`) to Cloudflare *Workers* with `wrangler deploy`
#  (config in `apps/admin/wrangler.jsonc`).
#
#  ONE-TIME MANUAL CLOUDFLARE SETUP (before the first admin prod deploy)
#  --------------------------------------------------------------------
#   1. Create the Worker `rgss-admin` (the first `wrangler deploy` creates it).
#   2. Attach the custom domain `admin.theroyalglow.in` to the Worker
#      (Workers → rgss-admin → Settings → Domains & Routes). Detach it from the
#      old `rgss-admin` Pages project first to avoid a routing conflict.
#   3. Provision RUNTIME secrets on the Worker (NOT build vars), e.g.:
#         wrangler secret put DATABASE_URL          --name rgss-admin
#         wrangler secret put BETTER_AUTH_SECRET     --name rgss-admin
#         wrangler secret put ABLY_PRIVATE_KEY       --name rgss-admin
#         wrangler secret put UPSTASH_REDIS_REST_URL --name rgss-admin
#         ... (every server secret the admin app reads at runtime)
#      NOTE: the admin app shares the `.theroyalglow.in` session cookie with
#      apps/web, so BETTER_AUTH_SECRET MUST be identical across both Workers.
#      ⚠ The admin Worker now also hosts the background-jobs surface, so it MUST
#      carry the job-runtime secrets BEFORE the schedules go live (see the
#      "Register QStash schedules" post-deploy step):
#         wrangler secret put QSTASH_TOKEN            --name rgss-admin
#         wrangler secret put RESEND_API_KEY          --name rgss-admin
#         wrangler secret put SLACK_WEBHOOK_URL       --name rgss-admin
#         wrangler secret put INVOICING_SERVICE_URL   --name rgss-admin
#         wrangler secret put INVOICE_PDF_HMAC_SECRET --name rgss-admin
#         ... (plus the BETTER_STACK_HEARTBEAT_* job heartbeat URLs)
#   4. Set the NEXT_PUBLIC_* BUILD variables as GitHub Actions repo/env vars
#      (see the "Build" step env block below) — inlined by `next build`, so they
#      must exist at BUILD time, not just at runtime.
#
#  REQUIRED GITHUB SECRETS
#    CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
#    SENTRY_ORG, SENTRY_ADMIN_PROJECT, SENTRY_ADMIN_AUTH_TOKEN,
#    QSTASH_TOKEN (post-deploy QStash schedule registration — moved here from
#      deploy-prod.yml; registers the 14 schedules against the admin origin),
#    BETTER_STACK_DEPLOY_WEBHOOK, BETTER_STACK_INCIDENT_WEBHOOK
#  (NEXT_PUBLIC_ADMIN_URL is a GitHub *var*, fed to register-schedules as the
#   origin to register the job destinations against.)
#
#  NOTE ON DB MIGRATIONS: the customer-site workflow (deploy-prod.yml) owns the
#  `migrate` job that applies committed Drizzle migrations to the prod Neon
#  branch. Both apps share `packages/db`, so migrations are applied once there —
#  this admin workflow does NOT re-run them to avoid double-applying DDL.
# ============================================================================
name: Deploy Admin Production

on:
  push:
    branches: [prod]
    paths:
      - 'apps/admin/**'
      - 'packages/**'

jobs:
  # --------------------------------------------------------------------------
  # Gate: only deploy a commit whose CI checks are all green.
  # --------------------------------------------------------------------------
  pre-deploy-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Wait for the CI workflow to pass for this commit
        run: |
          # deploy-admin-prod triggers on the SAME push as CI, so CI is usually
          # still running when this gate starts — a single-shot read returns
          # "missing" and false-fails. Poll the CI workflow's run for THIS sha
          # until it completes (max ~15 min), then require success. Scoped to
          # ci.yml so concurrent sibling deploy runs never cross-fail the gate.
          for i in $(seq 1 60); do
            RUN=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&per_page=1" \
              --jq '.workflow_runs[0] // {} | "\(.status) \(.conclusion)"')
            STATUS=$(echo "$RUN" | awk '{print $1}')
            CONCLUSION=$(echo "$RUN" | awk '{print $2}')
            echo "attempt $i: status=${STATUS:-none} conclusion=${CONCLUSION:-none}"
            if [ "$STATUS" = "completed" ]; then
              test "$CONCLUSION" = "success"
              exit $?
            fi
            sleep 15
          done
          echo "Timed out waiting for CI to complete"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------------
  # Build the OpenNext Worker bundle and deploy it to Cloudflare Workers.
  # --------------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [pre-deploy-checks]
    environment:
      name: production-admin
      url: https://admin.theroyalglow.in
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # OpenNext build: runs `next build` then emits `.open-next/worker.js` +
      # `.open-next/assets`. NEXT_PUBLIC_* are inlined here, so they must be
      # present in this step's env (sourced from GitHub repo/environment vars).
      # SKIP_ENV_VALIDATION skips strict server-secret validation at build time;
      # the Worker reads server secrets at runtime from `wrangler secret`.
      - name: Build (OpenNext → Cloudflare Worker)
        working-directory: apps/admin
        run: bunx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_ADMIN_URL: ${{ vars.NEXT_PUBLIC_ADMIN_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_ABLY_KEY: ${{ vars.NEXT_PUBLIC_ABLY_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          SKIP_ENV_VALIDATION: '1'

      # Best-effort Sentry client source-map upload for the ADMIN Sentry project
      # (no-op without the token).
      - name: Upload source maps to Sentry (admin project)
        continue-on-error: true
        run: |
          bunx @sentry/cli sourcemaps upload \
            --org ${{ secrets.SENTRY_ORG }} \
            --project ${{ secrets.SENTRY_ADMIN_PROJECT }} \
            --release ${{ github.sha }} \
            apps/admin/.next/static apps/admin/.open-next
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_ADMIN_AUTH_TOKEN }}

      # Deploy the built Worker. wrangler reads apps/admin/wrangler.jsonc (main =
      # .open-next/worker.js) and publishes to the `rgss-admin` Worker + its
      # attached custom domain.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/admin
          packageManager: bun
          command: deploy

  # --------------------------------------------------------------------------
  # Post-deploy verification: health check against the live admin subdomain.
  # (No public smoke-paths — admin routes are RBAC-gated and redirect to
  # sign-in unauthenticated, so only the unauthenticated health endpoint is
  # asserted here.)
  # --------------------------------------------------------------------------
  post-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy]
    # REQUIRED so the "Register QStash schedules" step can read the
    # `production-admin` environment secret QSTASH_TOKEN (and the optional
    # BETTER_STACK_DEPLOY_WEBHOOK). Without it QSTASH_TOKEN resolves empty and
    # schedule registration fails.
    environment: production-admin
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Health check (retry 3x with 10s delay)
        run: |
          for i in 1 2 3; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 30 https://admin.theroyalglow.in/api/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Health check failed (attempt $i, status: $STATUS). Retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 3 attempts"
          exit 1

      # ----------------------------------------------------------------------
      # Register the 14 QStash scheduled jobs against the ADMIN origin. The
      # background-jobs surface now lives in apps/admin (served from
      # admin.theroyalglow.in/api/jobs/*), so registration MOVED here from
      # deploy-prod.yml. Runs AFTER deploy + health check so the destination
      # URLs (https://admin.theroyalglow.in/api/jobs/*) are live and reachable
      # (QStash cannot POST to localhost). The script is idempotent: it deletes
      # any existing schedule pointing at the same destination, then recreates
      # it from JOB_SCHEDULES — so every prod deploy converges QStash to the
      # committed source of truth.
      #
      # register-schedules.ts reads process.env.NEXT_PUBLIC_APP_URL as the
      # origin to register against; in the admin deploy this MUST be the admin
      # public origin, so it is fed from vars.NEXT_PUBLIC_ADMIN_URL.
      #
      # ⚠ SECRETS-BEFORE-SCHEDULES (CRITICAL ORDERING): the rgss-admin Worker
      # must already carry ALL job-runtime secrets as `wrangler secret`s BEFORE
      # these schedules go live, or the relocated jobs degrade/fail at runtime:
      #   - QSTASH_TOKEN              (triggered enqueue from admin routes)
      #   - RESEND_API_KEY           (email-sending jobs: reminders, reports…)
      #   - SLACK_WEBHOOK_URL        (Slack report jobs)
      #   - BETTER_STACK_HEARTBEAT_* (per-job heartbeat ping URLs)
      #   - INVOICING_SERVICE_URL    (invoice-pdf job render service)
      #   - INVOICE_PDF_HMAC_SECRET  (invoice-pdf job request signing)
      # Provision these on rgss-admin before the first deploy that registers the
      # schedules. The QSTASH_TOKEN below is the GitHub Actions secret used only
      # to PUBLISH the schedule definitions to QStash from CI.
      # ----------------------------------------------------------------------
      - name: Register QStash schedules (idempotent)
        working-directory: apps/admin
        run: bun run register-schedules
        env:
          QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_ADMIN_URL }}

      - name: Notify deployment success
        if: success()
        run: |
          if [ -n "${{ secrets.BETTER_STACK_DEPLOY_WEBHOOK }}" ]; then
            curl -X POST "${{ secrets.BETTER_STACK_DEPLOY_WEBHOOK }}" \
              -H "Content-Type: application/json" \
              -d '{"sha": "${{ github.sha }}", "status": "success", "env": "prod", "app": "admin"}'
          else
            echo "BETTER_STACK_DEPLOY_WEBHOOK not set — skipping deploy notification"
          fi

  # --------------------------------------------------------------------------
  # REAL auto-rollback: `wrangler rollback` re-points the Worker at its previous
  # deployment version (the old step only *listed* Pages deployments and rolled
  # back nothing). Workers keeps prior versions, so this is an instant revert.
  # --------------------------------------------------------------------------
  auto-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [post-deploy]
    if: failure()
    # REQUIRED to read the `production-admin` environment secret
    # CLOUDFLARE_API_TOKEN (and ACCOUNT_ID) for wrangler rollback.
    environment: production-admin
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Roll back the admin Worker to its previous version
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/admin
          packageManager: bun
          command: 'rollback --message "Auto-rollback admin prod health check failed for ${{ github.sha }}"'
      - name: Notify deployment failure
        run: |
          if [ -n "${{ secrets.BETTER_STACK_INCIDENT_WEBHOOK }}" ]; then
            curl -X POST "${{ secrets.BETTER_STACK_INCIDENT_WEBHOOK }}" \
              -H "Content-Type: application/json" \
              -d '{"title": "Admin production deploy failed — rolled back", "sha": "${{ github.sha }}"}'
          else
            echo "BETTER_STACK_INCIDENT_WEBHOOK not set — skipping incident notification"
          fi
