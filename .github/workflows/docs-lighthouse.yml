name: Docs Lighthouse

# ---------------------------------------------------------------------------
# Lighthouse CI for the docs site (docs-theming-and-versioning Req 4.4, 4.5).
#
# Unlike the admin Lighthouse gate in ci.yml (which audits the live
# admin.theroyalglow.in deploy), this gate is SELF-CONTAINED: it builds the
# Fumadocs app from the PR source, serves the production build locally via
# `next start`, and runs LHCI against localhost. That means the gate runs on
# every docs change without needing a deploy to exist.
#
# Thresholds + the audited route list live in
# .github/lighthouse/lighthouserc.docs.json (the single source of truth):
#   performance >= 0.95, accessibility = 1.0, seo = 1.0, best-practices >= 0.95
# on the docs landing page, one content page per top-level section, and a
# legacy /docs/v2 page. The job fails if any route misses any threshold.
#
# Conventions mirror ci.yml: actions/checkout@v4, oven-sh/setup-bun@v2,
# `bun install --frozen-lockfile`, and a turbo-scoped build (--filter=@rgss/docs).
# ---------------------------------------------------------------------------

on:
  pull_request:
    branches: [dev, test, pprd, prod]
    paths:
      - 'docs/**'
      - 'packages/**'
      - '.github/lighthouse/lighthouserc.docs.json'
      - '.github/workflows/docs-lighthouse.yml'
  push:
    branches: [dev]
    paths:
      - 'docs/**'
      - 'packages/**'
      - '.github/lighthouse/lighthouserc.docs.json'
      - '.github/workflows/docs-lighthouse.yml'

concurrency:
  group: docs-lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build docs site
        run: bunx turbo run build --filter=@rgss/docs
        env:
          SKIP_ENV_VALIDATION: '1'
      - name: Run Lighthouse CI (docs)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .github/lighthouse/lighthouserc.docs.json
          uploadArtifacts: true
          temporaryPublicStorage: true
