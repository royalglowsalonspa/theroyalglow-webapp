# =============================================================================
# Deploy apps/web + apps/admin to AWS (M2AWS §8)
# -----------------------------------------------------------------------------
# SST v3 -> Lambda (ARM64) + CloudFront + S3, region ap-southeast-1.
# apps/cms stays on Render; apps/invoicing stays on Cloud Run; Neon, Upstash,
# QStash, Resend, Ably and R2 are untouched.
#
# Auth is GitHub OIDC — no long-lived AWS keys in repo secrets. One-time setup
# is in M2AWS.md §8.
#
# RECOVERY: there is no one-command rollback. SST/Pulumi updates are not
# atomic: a failed command can leave CloudFront, Lambda, S3, DNS, or stack
# state partially updated. Inspect Deploy logs and SST/Pulumi stack state,
# verify both public /api/health endpoints, then use workflow_dispatch with
# `git_ref` set to a known-good tag/SHA when redeployment is required.
# PostHog feature flags remain the instant kill switch.
#
# Database migrations never run in this workflow. Apply committed, forward-only
# migrations through migrate.yml over DATABASE_URL_UNPOOLED, one Neon branch at
# a time in dev -> test -> pprd -> prod order.
# =============================================================================
name: Deploy AWS

on:
  push:
    branches: [prod]
    paths:
      - 'apps/web/**'
      - 'apps/admin/**'
      - 'packages/**'
      - 'sst.config.ts'
      - 'bun.lock'
      - '.github/workflows/deploy-aws.yml'
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Ref to deploy (tag/SHA). Blank = current branch. Use a previous ref to roll back.'
        required: false
        type: string

concurrency:
  group: deploy-aws-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  SST_STAGE: production

permissions:
  contents: read
  id-token: write # required for OIDC

jobs:
  deploy:
    name: SST deploy
    # Repository deployment kill switch. Keep AWS_DEPLOY_ENABLED=true for
    # normal production deploys; setting it false intentionally skips this job.
    # AWS_DEPLOY_ROLE_ARN must also be configured for GitHub OIDC.
    if: vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production-aws
      url: https://theroyalglow.in
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_ref || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # NEXT_PUBLIC_* are inlined into the client bundle by `next build`, so they
      # MUST be present here. They are repo *variables*, not secrets — they ship
      # to the browser either way. Server secrets come from SST Secrets (SSM) and
      # are NOT passed here.
      #
      # NEXT_PUBLIC_APP_URL is deliberately absent: it differs per app and is set
      # per component in sst.config.ts.
      - name: Deploy
        env:
          # Cloudflare is DNS-only here. SST uses its API to manage ACM
          # validation records and the two aliases for theroyalglow.in.
          # Needs Zone:Read + DNS:Edit on that one zone. Without it the deploy
          # fails at certificate validation, not at build.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # A zone-scoped token cannot enumerate accounts, so SST cannot infer
          # the account and aborts before it builds anything. Not a secret — the
          # same ID is already the subdomain of R2_ENDPOINT below.
          CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_ABLY_KEY: ${{ vars.NEXT_PUBLIC_ABLY_KEY }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_ADMIN_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_ADMIN_SENTRY_DSN }}
          NEXT_PUBLIC_R2_PUBLIC_URL: ${{ vars.NEXT_PUBLIC_R2_PUBLIC_URL }}
          NEXT_PUBLIC_CMS_URL: ${{ vars.NEXT_PUBLIC_CMS_URL }}
          NEXT_PUBLIC_ADMIN_URL: ${{ vars.NEXT_PUBLIC_ADMIN_URL }}
          NEXT_PUBLIC_META_PIXEL_ID: ${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}
          NEXT_PUBLIC_CLARITY_ID: ${{ vars.NEXT_PUBLIC_CLARITY_ID }}
          # Non-secret runtime config read by sst.config.ts
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          INVOICING_SERVICE_URL: ${{ vars.INVOICING_SERVICE_URL }}
        run: bunx sst deploy --stage "$SST_STAGE"

      # There is no `sst outputs` subcommand (checked against sst 4.17.1), so the
      # original version of this step failed every run *after* a successful
      # deploy. The deploy step prints the URLs itself and writes them to
      # .sst/outputs.json; a missing summary must never fail a good deploy.
      - name: Capture deployed URLs
        id: urls
        continue-on-error: true
        run: |
          {
            echo '### Deployed URLs'
            if [ -s .sst/outputs.json ]; then
              echo '```json'
              cat .sst/outputs.json
              echo '```'
            else
              echo 'No .sst/outputs.json produced — see the Deploy step log.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The public-domain release gate runs when AWS_DOMAINS_LIVE=true. Domains
      # are live after the completed cutover, so production should keep that
      # repository variable enabled.
      - name: Health check
        if: vars.AWS_DOMAINS_LIVE == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            web=$(curl -sf -o /dev/null -w '%{http_code}' https://theroyalglow.in/api/health || echo 000)
            adm=$(curl -sf -o /dev/null -w '%{http_code}' https://admin.theroyalglow.in/api/health || echo 000)
            echo "attempt $i: web=$web admin=$adm"
            if [ "$web" = 200 ] && [ "$adm" = 200 ]; then exit 0; fi
            sleep 15
          done
          echo "health check failed — consider redeploying a previous ref (see header)"
          exit 1

      # The webhook check lives in the script, not in `if:` — step-level `env`
      # is not in scope for that step's own condition, so the old
      # `env.INCIDENT_WEBHOOK != ''` guard was always false and this never fired.
      - name: Notify failure
        if: failure()
        env:
          INCIDENT_WEBHOOK: ${{ secrets.BETTER_STACK_INCIDENT_WEBHOOK }}
        run: |
          [ -n "$INCIDENT_WEBHOOK" ] || { echo 'no incident webhook configured'; exit 0; }
          curl -sf -X POST "$INCIDENT_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d '{"title":"AWS deploy failed","sha":"${{ github.sha }}"}' || true
