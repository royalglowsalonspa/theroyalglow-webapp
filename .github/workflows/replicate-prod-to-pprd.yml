# Ops-activated: requires Neon API key + project/branch IDs to run.
# Resets the preprod branch from main (near-instant copy-on-write) then strips
# PII. Mirrors git-workflow.md "Prod -> Preprod Data Replication".
name: Replicate Prod to Preprod (Daily)

on:
  schedule:
    - cron: '0 1 * * *' # 1 AM UTC daily
  workflow_dispatch:

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Reset preprod branch from main
        run: |
          curl -X POST \
            "https://console.neon.tech/api/v2/projects/${{ secrets.NEON_PROJECT_ID }}/branches/${{ secrets.NEON_PREPROD_BRANCH_ID }}/restore" \
            -H "Authorization: Bearer ${{ secrets.NEON_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"source_branch_id": "${{ secrets.NEON_MAIN_BRANCH_ID }}"}'

      - name: Anonymize PII in preprod
        run: bun run scripts/anonymize-preprod.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PPRD }}

      - name: Ping BetterStack heartbeat
        run: curl -sf "${{ secrets.BETTER_STACK_HEARTBEAT_PREPROD_SYNC }}"
