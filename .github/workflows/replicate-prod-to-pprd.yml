# Ops-activated: requires Neon API key + project/branch IDs to run.
# Resets the pprd branch from prod (near-instant copy-on-write) then strips
# PII. Mirrors git-workflow.md "Prod → pprd Data Replication".
name: Replicate Prod to pprd (Daily)

on:
  schedule:
    - cron: '0 1 * * *' # 1 AM UTC daily
  workflow_dispatch:

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      - name: Reset pprd branch from prod
        run: |
          curl -X POST \
            "https://console.neon.tech/api/v2/projects/${{ secrets.NEON_PROJECT_ID }}/branches/${{ secrets.NEON_PPRD_BRANCH_ID }}/restore" \
            -H "Authorization: Bearer ${{ secrets.NEON_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"source_branch_id": "${{ secrets.NEON_PROD_BRANCH_ID }}"}'

      - name: Anonymize PII in pprd
        run: bun run scripts/anonymize-preprod.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PPRD }}
          # Explicit opt-in guard — the script refuses to overwrite PII unless
          # this is set, so it can only ever target pprd (never prod/dev).
          PPRD_ANONYMIZE: '1'

      - name: Ping BetterStack heartbeat
        run: curl -sf "${{ secrets.BETTER_STACK_HEARTBEAT_PPRD_SYNC }}"
