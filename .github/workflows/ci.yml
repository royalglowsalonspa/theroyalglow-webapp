name: CI

on:
  pull_request:
    branches: [dev, test, pprd, prod]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Path filter — decides which per-app jobs run (Req 10.2, 10.3, 10.4).
  # `admin` / `web` are true when that app OR any shared package changed,
  # since packages/** affect both apps.
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      admin: ${{ steps.filter.outputs.admin }}
      web: ${{ steps.filter.outputs.web }}
      invoicing: ${{ steps.filter.outputs.invoicing }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            admin:
              - 'apps/admin/**'
              - 'packages/**'
            web:
              - 'apps/web/**'
              - 'packages/**'
            invoicing:
              - 'apps/invoicing/**'
              - 'packages/**'

  # ---------------------------------------------------------------------------
  # Per-app CI: lint + typecheck + test + build scoped via turbo filters.
  # Each job reports its own pass/fail independently (Req 10.1, 10.7) and a
  # failed app build blocks only that app's deploy — the other app's job is
  # unaffected because they have no `needs` relationship between them.
  # ---------------------------------------------------------------------------
  admin-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.admin == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint, typecheck, test, build (admin)
        run: bunx turbo run lint typecheck test build --filter=@rgss/admin
        env:
          SKIP_ENV_VALIDATION: '1'
          # Raise the Node heap for `next build` — the default ceiling can OOM
          # (exit 137) on the ~7 GB ubuntu-latest runner while bundling the
          # admin app (recharts + react-table across ~40 routes). Harmless if
          # memory was never the issue.
          NODE_OPTIONS: '--max-old-space-size=4096'
      - name: Upload admin build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-build-output
          path: apps/admin/.next/
          retention-days: 1

  web-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint, typecheck, test, build (web)
        run: bunx turbo run lint typecheck test build --filter=@rgss/web
        env:
          SKIP_ENV_VALIDATION: '1'
          # Raise the Node heap for `next build` — guards against an OOM
          # (exit 137) on the ~7 GB ubuntu-latest runner. Harmless otherwise.
          NODE_OPTIONS: '--max-old-space-size=4096'
      - name: Upload web build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-build-output
          path: apps/web/.next/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Invoicing service CI: lint + typecheck + build scoped via turbo filter.
  # The standalone @rgss/invoicing (Hono + @react-pdf/renderer) Cloud Run
  # service. `build` runs tsup, which bundles the workspace @rgss/* deps inline
  # — so this job catches bundling regressions before a manual `gcloud run
  # deploy`. No test step: the service currently ships no unit tests (its render
  # contract + HMAC helpers are covered by @rgss/types / @rgss/business tests in
  # the repo-wide unit-tests job).
  # ---------------------------------------------------------------------------
  invoicing-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.invoicing == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint, typecheck, build (invoicing)
        run: bunx turbo run lint typecheck build --filter=@rgss/invoicing
        env:
          SKIP_ENV_VALIDATION: '1'

  # ---------------------------------------------------------------------------
  # Lighthouse CI against admin.theroyalglow.in (Req 10.6, 13.7, 13.8).
  # Runs only when admin changed and its CI passed. Thresholds are enforced in
  # .github/lighthouse/lighthouserc.json (perf >= 90, a11y = 100, bp >= 95);
  # the job fails if any threshold is not met.
  #
  # The route list is the `collect.url` array in lighthouserc.json (the single
  # source of truth) — it enumerates every redesigned admin route so the
  # accessibility = 100 gate is enforced PER ROUTE: Lighthouse CI reports each
  # URL separately, so a score < 100 on ANY audited route fails the gate and
  # blocks merge, naming the offending URL. The `urls:` action input is
  # intentionally omitted so it does NOT override that list.
  #
  # NOTE: this targets the deployed admin URL, so it asserts against the live
  # subdomain — the deploy must exist for meaningful results. Admin routes are
  # RBAC-gated (incl. `/`); unauthenticated runs redirect to sign-in, so true
  # per-route scores require supplying LHCI a session (not fabricated here —
  # see the "//" note in lighthouserc.json).
  # ---------------------------------------------------------------------------
  lighthouse-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [admin-ci]
    if: needs.changes.outputs.admin == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .github/lighthouse/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  # ---------------------------------------------------------------------------
  # Repo-wide quality gates (cover shared packages and run on every PR).
  # Kept lean and parallel to the per-app jobs so the total workflow stays
  # within the 15-minute budget (Req 10.1).
  # ---------------------------------------------------------------------------
  lint-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
        env:
          SKIP_ENV_VALIDATION: '1'

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test:coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Audit dependencies (bun audit — blocking gate)
        # Authoritative dependency-advisory gate for this Bun/npm monorepo:
        # native, no flaky external DB pull. Exits non-zero on any advisory.
        run: bun audit
      - name: Trivy vulnerability scan (informational — IaC/secret/OS coverage)
        # Defense-in-depth beyond `bun audit` (IaC misconfig, secrets, OS pkgs).
        # Non-blocking: trivy-action's GHCR setup/DB pull rate-limits anonymous
        # access (TOOMANYREQUESTS), failing the step in ~2s before any scan —
        # an infra flake, not a finding. Kept for signal; `bun audit` is the gate.
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1
      - name: Socket.dev supply chain check
        uses: SocketDev/socket-security-action@v1
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Cutover guards (admin-subdomain-migration) — Req 2.2, 2.7, 9.1, 9.2, 14.5,
  # 15.4. A required check on every PR/push: a violation FAILS this job and,
  # because it is a required status check, BLOCKS merge and deploy.
  #
  #   1. Path assertion — zero admin artifacts under apps/web and no admin
  #      RBAC / role-gating in the web middleware (a /admin 301-redirect branch
  #      is allowed; ROLE_LEVELS / get-session role-gating is not).
  #   2. Migration-diff — no new ADMIN-SUBDOMAIN DB migration is introduced
  #      relative to the base branch (the admin-subdomain feature adds no schema
  #      changes). The filename scan inside `check:cutover` catches
  #      admin-subdomain-named migrations; the git-diff step below mirrors that
  #      pattern, failing only on newly added migrations whose FILENAME matches
  #      the admin/subdomain marker. General "schema must match a committed
  #      migration" discipline is owned by the `drift-gate` job + the
  #      migration-discipline steering doc, so legitimate generated/committed
  #      migrations (e.g. the schema-drift-remediation baseline) are NOT blocked
  #      here — only stray admin-subdomain schema changes are.
  # ---------------------------------------------------------------------------
  cutover-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Assert no admin artifacts / no admin RBAC in web / no admin migration
        run: bun run check:cutover
      - name: Migration-diff — no new admin-subdomain DB migrations vs base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          ADDED=$(git diff --name-only --diff-filter=A "$BASE_SHA"...HEAD -- 'packages/db/migrations/**/*.sql' || true)
          # Mirror check:cutover's MIGRATION_NAME_MARKERS — only fail on migrations
          # whose FILENAME marks them as admin-subdomain schema changes. Legitimate
          # baseline/forward migrations are allowed; the drift-gate job enforces that
          # any such migration actually matches the committed schema.
          OFFENDING=$(printf '%s\n' "$ADDED" | grep -Ei 'admin[_-]subdomain|admin[_-]migration' || true)
          if [ -n "$OFFENDING" ]; then
            echo "✖ New admin-subdomain DB migration(s) introduced — the admin-subdomain feature must add no schema changes (Req 14.5):"
            echo "$OFFENDING" | sed 's/^/  • /'
            exit 1
          fi
          echo "✔ No new admin-subdomain DB migrations introduced vs base branch."
          echo "  (General schema/migration discipline is enforced by the drift-gate job.)"

  # ---------------------------------------------------------------------------
  # Admin static gates (admin-portal-redesign) — presentation-layer guards over
  # apps/admin source. Node-only (no install/build), so it stays well within the
  # workflow budget. A violation FAILS this job and, as a required status check,
  # BLOCKS merge.
  #
  #   • No emoji icons (Req 2.3) — assert no Unicode emoji glyph is rendered as
  #     an icon anywhere in the admin presentation source (App_Shell, Sidebar,
  #     Dashboard, and every other admin component/page). The redesign replaced
  #     the legacy emoji NAV_ICONS / KPI icons with lucide-react components; this
  #     gate prevents emoji from creeping back in.
  #
  #   • Root-Path Convention (Req 4.9) — assert every ADMIN_NAV href in
  #     apps/admin/src/lib/rbac.ts omits the `/admin` prefix. The admin app is
  #     served from the admin.theroyalglow.in subdomain (which provides the
  #     admin namespace), so nav hrefs must be root paths (e.g. `/bookings`).
  # ---------------------------------------------------------------------------
  admin-static-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No emoji icons in admin presentation source (Req 2.3)
        run: node scripts/assert-no-emoji-icons.mjs
      # -----------------------------------------------------------------------
      # Path-allowlist gate (admin-portal-redesign · task 11.4) — Req 16.1–16.3,
      # 16.6–16.8. The redesign is presentation-layer ONLY; this gate inspects
      # the PR diff vs the base branch (BASE_SHA, mirroring the cutover-guards
      # migration-diff step) and FAILS when an admin presentation change reaches
      # past its boundary into a PROTECTED path: packages/db/(src/)schema,
      # packages/db/migrations, an admin API route contract, apps/admin/src/lib/
      # rbac.ts, or the committed drift fingerprint reference. A protected-path
      # change made WITHOUT admin presentation changes is out of this gate's
      # scope (owned by drift-gate / cutover-guards) and passes here.
      # -----------------------------------------------------------------------
      - name: Admin presentation stays within its path boundary (Req 16)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/admin-design/path-allowlist.mjs
      - name: Root-Path Convention — ADMIN_NAV omits the /admin prefix (Req 4.9)
        run: node scripts/admin-design/root-path-convention.mjs

  # ---------------------------------------------------------------------------
  # Admin design-system static gates (admin-portal-redesign) — Req 1.1, 1.2.
  # A required check on every PR/push: a violation FAILS this job and, because
  # it is a required status check, BLOCKS merge and deploy.
  #
  #   no-brand-literals — asserts zero hard-coded hex / rgb() / rgba() / hsl()
  #     colour literals and zero raw Tailwind colour-PALETTE utilities
  #     (e.g. bg-amber-50) in admin component source
  #     (apps/admin/src/components/**, apps/admin/src/app/**). All colour, font,
  #     radius, and shadow values must come from the shared @rgss/ui Brand
  #     Tokens via named Tailwind utilities or var(--color-…) references.
  # ---------------------------------------------------------------------------
  admin-design-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: No brand literals in admin component source
        run: bun run check:admin-no-literals

  # ---------------------------------------------------------------------------
  # Drift gate (schema-drift-remediation) — Req 12.4, 12.5. Runs on every PR
  # (covers the shared packages/db). DB-FREE: CI has no Neon branch, so the gate
  # never connects to a database — it asserts that the code schema and the
  # committed migration history have not diverged. A PR that changes
  # packages/db/src/schema without a matching committed migration (and
  # regenerated reference) FAILS here and BLOCKS merge.
  #
  #   1. drizzle-kit check — validates the migration journal/snapshot integrity.
  #   2. Canonical fingerprint reference test — re-derives the fingerprint from
  #      the committed drizzle snapshot and asserts it equals the committed
  #      reference artifact; fails if the schema/snapshot moved without
  #      regenerating the reference.
  #   3. Schema-vs-migration divergence — runs drizzle-kit generate and asserts
  #      it produced no new/changed migration files (an uncommitted generated
  #      migration means a schema change has no committed migration).
  # ---------------------------------------------------------------------------
  drift-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Validate migration journal/snapshot integrity (drizzle-kit check)
        working-directory: packages/db
        env:
          SKIP_ENV_VALIDATION: '1'
        run: bunx drizzle-kit check
      - name: Canonical fingerprint reference test (DB-free drift gate)
        env:
          SKIP_ENV_VALIDATION: '1'
        run: bunx vitest run packages/db/scripts/drift/__tests__/canonical-reference.test.ts
      - name: Schema-vs-migration divergence — no uncommitted generated migration
        env:
          SKIP_ENV_VALIDATION: '1'
        run: |
          # drizzle-kit generate is DB-free: it diffs packages/db/src/schema vs
          # the committed snapshot. If the schema moved without a committed
          # migration, it emits a new migration .sql + rewrites meta/_journal.json
          # (a tracked file) → non-empty diff under packages/db/migrations.
          ( cd packages/db && bunx drizzle-kit generate --name ci_drift_probe )
          if ! git diff --exit-code -- packages/db/migrations; then
            echo ""
            echo "✖ Code schema diverges from the committed migration history."
            echo "  A change under packages/db/src/schema has no matching committed migration."
            echo "  Fix: in packages/db run 'bun run generate' then 'bun run drift:reference',"
            echo "       review the emitted SQL, and commit the migration + reference artifact."
            # Restore tracked files and drop the untracked probe artifacts so the
            # only signal this step produces is the pass/fail above.
            git checkout -- packages/db/migrations 2>/dev/null || true
            git clean -fd packages/db/migrations 2>/dev/null || true
            exit 1
          fi
          echo "✔ No schema/migration divergence — code schema matches committed migrations."
          # Clean any untracked probe artifacts even on the success path.
          git clean -fd packages/db/migrations >/dev/null 2>&1 || true
