name: Request scheduled Renovate check

on:
  schedule:
    - cron: '0 0 * * 1,3,5'
  workflow_dispatch:

concurrency:
  group: renovate-scheduled-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  request-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - name: Require the default production branch
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$REF" = refs/heads/prod
          test "$DEFAULT_BRANCH" = prod
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Request a hosted Renovate run and verify acknowledgement
        run: bun run scripts/ci/request-renovate-run.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
