name: Integration & E2E

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [dev, test, pprd, prod]

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/synthetic-postgres
      - name: Run database integration tests
        env:
          ADMIN_REHEARSAL_TAX: '1'
          ADMIN_REHEARSAL_MEMBERSHIP_HISTORY: '1'
        run: |
          export NODE_OPTIONS="--import=$RGSS_LOCAL_DB_PRELOAD"
          # The separate Neon drift harness forks production and requires a cloud
          # management credential. Keep it out of the runner-local database suite.
          bun run test:integration --no-file-parallelism \
            --exclude 'packages/db/scripts/drift/__tests__/**'

  playwright-e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/synthetic-postgres
      - run: bunx playwright install --with-deps chromium
      - name: Run customer website Playwright tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: |
          export DATABASE_URL="${DATABASE_URL/127.0.0.1/localhost}"
          export NODE_OPTIONS="--import=$RGSS_LOCAL_DB_PRELOAD"
          bun run test:e2e
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  integration-success:
    name: Integration Success
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    if: always()
    needs: [integration-tests, playwright-e2e]
    steps:
      - name: Require both suites to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq -e 'all(. == "success")' <<< "$RESULTS" >/dev/null
