name: Register QStash Schedules

# ---------------------------------------------------------------------------
# MANUAL registrar for the QStash scheduled background jobs.
#
# Why this exists: this used to be a post-deploy step inside
# deploy-admin-prod.yml. That workflow deployed the admin app to Cloudflare
# Workers, which is no longer how this project ships (Render deploys web/admin/cms
# from git — see render.yaml), so it was retired. Registration itself is still
# required, so it lives here rather than being lost with the workflow.
#
# OWNERSHIP (admin-web-separation Req 2.2, 3.6): the background-jobs surface
# belongs to the ADMIN app. Schedules must therefore be registered against the
# ADMIN origin (admin.theroyalglow.in), never the customer site. The invariant
# test apps/web/src/__tests__/admin-web-separation.invariants.test.ts asserts
# this workflow — and not any customer-side workflow — owns the registration.
#
# `register-schedules` is idempotent (QStash upserts by destination), so
# re-running it is safe and is a no-op once the schedules exist.
#
# Run it after any change to the job schedule definitions, and once after the
# first Render deploy of the admin app.
#
# Required GitHub secrets/vars (this runs on the GitHub runner, so Render's
# dashboard env vars are NOT visible to it):
#   secret QSTASH_TOKEN            — Upstash QStash token
#   var    NEXT_PUBLIC_ADMIN_URL   — e.g. https://admin.theroyalglow.in
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Check required configuration
        env:
          QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
          ADMIN_URL: ${{ vars.NEXT_PUBLIC_ADMIN_URL }}
        run: |
          missing=""
          [ -z "$QSTASH_TOKEN" ] && missing="$missing QSTASH_TOKEN(secret)"
          [ -z "$ADMIN_URL" ] && missing="$missing NEXT_PUBLIC_ADMIN_URL(variable)"
          if [ -n "$missing" ]; then
            echo "::error title=Missing configuration::Cannot register schedules without:$missing"
            exit 1
          fi
          echo "Registering schedules against $ADMIN_URL"

      # Registration targets the ADMIN origin — the background-jobs surface owner.
      - name: Register QStash schedules (idempotent)
        working-directory: apps/admin
        env:
          QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_ADMIN_URL }}
        run: bun run register-schedules
