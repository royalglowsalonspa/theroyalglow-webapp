name: Register QStash Schedules
run-name: Production QStash (${{ inputs.operation == 'register' && (inputs.dry_run && 'dry run' || 'apply') || inputs.operation }})

# ---------------------------------------------------------------------------
# MANUAL registrar for the QStash scheduled background jobs.
#
# Registration is intentionally separate from the AWS application deploy.
# apps/web and apps/admin run on AWS Lambda + CloudFront through SST; this manual
# workflow keeps QStash schedule changes explicit and independently repeatable.
#
# OWNERSHIP (admin-web-separation Req 2.2, 3.6): the background-jobs surface
# belongs to the ADMIN app. Schedules must therefore be registered against the
# ADMIN origin (admin.theroyalglow.in), never the customer site. The invariant
# test apps/web/src/__tests__/admin-web-separation.invariants.test.ts asserts
# this workflow — and not any customer-side workflow — owns the registration.
#
# A dry run is the default and can show every job. Apply requires explicit
# job keys. It adds missing selected jobs and leaves matching schedules in
# place. Resolve paused, duplicate, or mismatched schedules explicitly.
# Verify checks the whole production inventory without changing it. The signed
# canary sends only a probe with no invoice ID and never registers schedules.
#
# Run it after any change to the job schedule definitions, and once after the
# first successful AWS admin deployment.
#
# Dispatch from prod. GitHub runners do not inherit SST runtime secrets.
# Configure these under GitHub Actions settings:
#   production-aws environment secret QSTASH_TOKEN — production Upstash token
#   var    NEXT_PUBLIC_ADMIN_URL   — e.g. https://admin.theroyalglow.in
#   var    QSTASH_URL              — optional, defaults to https://qstash.upstash.io
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Register schedules, verify the full inventory, or run a signed probe without an invoice'
        type: choice
        default: register
        options:
          - register
          - verify
          - signed-canary
      dry_run:
        description: 'Preview schedule registration without making provider changes'
        type: boolean
        default: true
      jobs:
        description: 'Comma-separated canonical job keys. Required to apply. Leave blank to preview default jobs.'
        type: string

concurrency:
  group: register-qstash-schedules
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate production ref
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: Require the production ref
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/prod" ]; then
            echo '::error title=Unexpected ref::Dispatch schedule registration from the prod branch.'
            exit 1
          fi

  register:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production-aws
      deployment: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # Registration targets the ADMIN origin. Workflow inputs become arguments.
      - name: Register QStash schedules or run the selected production check
        working-directory: apps/admin
        env:
          QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
          QSTASH_URL: ${{ vars.QSTASH_URL || 'https://qstash.upstash.io' }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_ADMIN_URL }}
          OPERATION: ${{ inputs.operation }}
          DRY_RUN: ${{ inputs.dry_run }}
          QSTASH_JOB_KEYS: ${{ inputs.jobs }}
        shell: bash
        run: |
          if [ -z "$QSTASH_TOKEN" ]; then
            echo '::error title=Missing QStash credential::Set QSTASH_TOKEN in the production-aws GitHub environment.'
            exit 1
          fi
          if [ "${NEXT_PUBLIC_APP_URL%/}" != "https://admin.theroyalglow.in" ]; then
            echo '::error title=Unexpected target::This workflow requires the production admin origin.'
            exit 1
          fi
          case "$OPERATION" in
            register) ;;
            verify|signed-canary)
              if [ "$DRY_RUN" != "true" ] || [ -n "$QSTASH_JOB_KEYS" ]; then
                echo '::error title=Conflicting inputs::Leave dry run enabled and job selection empty for production checks.'
                exit 1
              fi
              if [ "$OPERATION" = "verify" ]; then
                exec bun scripts/rehearse-qstash-delivery.ts --production --verify-schedules
              fi
              exec bun scripts/rehearse-qstash-delivery.ts --production --confirm-no-invoice-delivery
              ;;
            *) echo '::error title=Invalid operation::Select register, verify, or signed-canary.'; exit 1 ;;
          esac
          args=()
          case "$DRY_RUN" in
            true) args+=(--dry) ;;
            false)
              if [ -z "${QSTASH_JOB_KEYS//[[:space:]]/}" ]; then
                echo '::error title=Missing job selection::Specify the canonical job keys to apply.'
                exit 1
              fi
              ;;
            *) echo '::error title=Invalid mode::Select dry run or explicitly turn it off to apply.'; exit 1 ;;
          esac
          if [ -n "$QSTASH_JOB_KEYS" ]; then args+=(--jobs "$QSTASH_JOB_KEYS"); fi
          bun run register-schedules "${args[@]}"
