name: Register QStash Schedules

# ---------------------------------------------------------------------------
# MANUAL registrar for the QStash scheduled background jobs.
#
# Registration is intentionally separate from the AWS application deploy.
# apps/web and apps/admin run on AWS Lambda + CloudFront through SST; this manual
# workflow keeps QStash schedule changes explicit and independently repeatable.
#
# OWNERSHIP (admin-web-separation Req 2.2, 3.6): the background-jobs surface
# belongs to the ADMIN app. Schedules must therefore be registered against the
# ADMIN origin (admin.theroyalglow.in), never the customer site. The invariant
# test apps/web/src/__tests__/admin-web-separation.invariants.test.ts asserts
# this workflow — and not any customer-side workflow — owns the registration.
#
# A dry run is the default. Scoped runs only add missing selected jobs and
# leave matching schedules in place. Resolve paused or duplicate jobs explicitly.
#
# Run it after any change to the job schedule definitions, and once after the
# first successful AWS admin deployment.
#
# Required GitHub secrets/vars. GitHub runners do not inherit SST runtime
# secrets or application environment variables:
#   secret QSTASH_TOKEN            — Upstash QStash token
#   var    NEXT_PUBLIC_ADMIN_URL   — e.g. https://admin.theroyalglow.in
#   var    QSTASH_URL              — optional QStash endpoint (defaults to EU)
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview schedules without making provider changes'
        type: boolean
        default: true
      jobs:
        description: 'Optional comma-separated canonical job keys. Leave blank for all jobs.'
        type: string

concurrency:
  group: register-qstash-schedules
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Check required configuration
        env:
          QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
          ADMIN_URL: ${{ vars.NEXT_PUBLIC_ADMIN_URL }}
        run: |
          missing=""
          [ -z "$QSTASH_TOKEN" ] && missing="$missing QSTASH_TOKEN(secret)"
          [ -z "$ADMIN_URL" ] && missing="$missing NEXT_PUBLIC_ADMIN_URL(variable)"
          if [ -n "$missing" ]; then
            echo "::error title=Missing configuration::Cannot register schedules without:$missing"
            exit 1
          fi
          if [ "${ADMIN_URL%/}" != "https://admin.theroyalglow.in" ]; then
            echo '::error title=Unexpected target::This workflow requires the production admin origin.'
            exit 1
          fi
          echo "Registering schedules against $ADMIN_URL"

      # Registration targets the ADMIN origin. Workflow inputs become arguments.
      - name: Register QStash schedules (idempotent)
        working-directory: apps/admin
        env:
          QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
          QSTASH_URL: ${{ vars.QSTASH_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_ADMIN_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
          QSTASH_JOB_KEYS: ${{ inputs.jobs }}
        shell: bash
        run: |
          args=()
          if [ "$DRY_RUN" != "false" ]; then args+=(--dry); fi
          if [ -n "$QSTASH_JOB_KEYS" ]; then args+=(--jobs "$QSTASH_JOB_KEYS"); fi
          bun run register-schedules "${args[@]}"
