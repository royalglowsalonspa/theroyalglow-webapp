name: Monthly Backup Restore Test

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      manifest_key:
        description: Exact weekly/ or release/ manifest key to verify
        required: true
        type: string
      release_candidate_sha:
        description: Full reviewed candidate SHA required for a release/ manifest
        type: string
      require_assets:
        description: Require the candidate-bound release asset inventory and verify its recovered bytes
        type: boolean
        default: false
      replay_candidate:
        description: Exercise and verify the exact candidate migrations after the isolated restore
        type: boolean
        default: false
      preview_cleanup:
        description: Preview reviewed test records using the private allowlist beside this release backup (requires assets and replay)
        type: boolean
        default: false
      cleanup_allowlist_sha256:
        description: SHA-256 of the exact reviewed cleanup allowlist file (required for preview)
        type: string
      retain_all_cleanup:
        description: Record the decision to retain all records (requires strict assets and replay)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  restore-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate the requested candidate replay inputs
        if: inputs.replay_candidate || inputs.preview_cleanup || inputs.retain_all_cleanup
        shell: bash
        env:
          SELECTED_MANIFEST: ${{ inputs.manifest_key }}
          RELEASE_CANDIDATE: ${{ inputs.release_candidate_sha }}
          REPLAY_CANDIDATE: ${{ inputs.replay_candidate }}
          REQUIRE_ASSETS: ${{ inputs.require_assets }}
          PREVIEW_CLEANUP: ${{ inputs.preview_cleanup }}
          ALLOWLIST_SHA256: ${{ inputs.cleanup_allowlist_sha256 }}
          RETAIN_ALL_CLEANUP: ${{ inputs.retain_all_cleanup }}
        run: |
          if [[ "$RETAIN_ALL_CLEANUP" == true && ( "$PREVIEW_CLEANUP" == true || -n "$ALLOWLIST_SHA256" ) ]]; then
            echo 'Choose either the retain-all decision or an exact cleanup allowlist preview.' >&2
            exit 1
          fi
          if [[ "$PREVIEW_CLEANUP" == true && ( "$REPLAY_CANDIDATE" != true || "$REQUIRE_ASSETS" != true ) ]]; then
            echo 'Cleanup preview requires both candidate replay and strict asset verification.' >&2
            exit 1
          fi
          if [[ "$RETAIN_ALL_CLEANUP" == true && ( "$REPLAY_CANDIDATE" != true || "$REQUIRE_ASSETS" != true ) ]]; then
            echo 'The retain-all decision requires both candidate replay and strict asset verification.' >&2
            exit 1
          fi
          if [[ "$PREVIEW_CLEANUP" == true && ! "$ALLOWLIST_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'Cleanup preview requires the SHA-256 of the exact reviewed allowlist.' >&2
            exit 1
          fi
          if [[ ! "$SELECTED_MANIFEST" =~ ^release/rgss_full_[0-9]{8}T[0-9]{6}Z_[0-9]+-[0-9]+\.manifest\.json$ ||
                ! "$RELEASE_CANDIDATE" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Candidate replay requires an exact release manifest key and full commit SHA.' >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        if: inputs.replay_candidate
        with:
          ref: ${{ inputs.release_candidate_sha }}
          fetch-depth: 0
          path: release-candidate
          persist-credentials: false

      - name: Confirm the candidate is in reviewed development history
        if: inputs.replay_candidate
        working-directory: release-candidate
        shell: bash
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/dev

      - uses: actions/setup-node@v6
        with:
          node-version-file: ${{ inputs.replay_candidate && 'release-candidate/.node-version' || '.node-version' }}

      - uses: oven-sh/setup-bun@v2
        if: inputs.replay_candidate
        with:
          bun-version-file: release-candidate/package.json

      - name: Install the candidate lockfile before opening the backup
        if: inputs.replay_candidate
        working-directory: release-candidate
        run: bun install --frozen-lockfile

      - name: Verify private R2 backup storage access
        shell: bash
        env:
          R2_BACKUP_ACCOUNT_ID: ${{ vars.R2_BACKUP_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_READ_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_READ_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: bash scripts/backup/verify-r2-backup-access.sh

      - name: Select preinstalled PostgreSQL 18 tools
        run: |
          test -x /usr/lib/postgresql/18/bin/pg_dump
          echo '/usr/lib/postgresql/18/bin' >> "$GITHUB_PATH"

      - name: Resolve and download the exact backup pair
        shell: bash
        env:
          SELECTED_MANIFEST: ${{ inputs.manifest_key }}
          PREVIEW_CLEANUP: ${{ inputs.preview_cleanup }}
          ALLOWLIST_SHA256: ${{ inputs.cleanup_allowlist_sha256 }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_READ_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_READ_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          umask 077
          key="$SELECTED_MANIFEST"
          if [[ -z "$key" ]]; then
            if ! key=$(aws s3api list-objects-v2 --bucket "$R2_BACKUP_BUCKET" --prefix weekly/rgss_full_ \
              --endpoint-url "$R2_BACKUP_ENDPOINT" |
              jq -er '[.Contents[]? | .Key | select(test("^weekly/rgss_full_[0-9]{8}T[0-9]{6}Z_[0-9]+-[0-9]+[.]manifest[.]json$"))] | max'); then
              echo '::error title=No verified backup available::The weekly backup manifest could not be resolved. Confirm a successful upload to rgss-backups.' >&2
              exit 1
            fi
          fi
          if [[ ! "$key" =~ ^(weekly|release)/rgss_full_[0-9]{8}T[0-9]{6}Z_[0-9]+-[0-9]+\.manifest\.json$ ]]; then
            echo '::error title=Invalid backup manifest key::Choose an exact weekly or release manifest key from a successful backup run.' >&2
            exit 1
          fi
          restore_dir=$(mktemp -d)
          dump_key="${key%.manifest.json}.dump"
          {
            echo "RESTORE_DIR=$restore_dir"
            echo "MANIFEST_PATH=$restore_dir/${key##*/}"
            echo "DUMP_PATH=$restore_dir/${dump_key##*/}"
            echo "DUMP_KEY=$dump_key"
          } >> "$GITHUB_ENV"
          aws s3 cp "s3://$R2_BACKUP_BUCKET/$key" "$restore_dir/${key##*/}" --endpoint-url "$R2_BACKUP_ENDPOINT"
          jq -e '.sourceId == "neon-prod"' "$restore_dir/${key##*/}" >/dev/null
          aws s3 cp "s3://$R2_BACKUP_BUCKET/$dump_key" "$restore_dir/${dump_key##*/}" --endpoint-url "$R2_BACKUP_ENDPOINT"
          if [[ "$PREVIEW_CLEANUP" == true ]]; then
            allowlist_key="${key%.manifest.json}.cleanup-allowlist.json"
            if ! aws s3 cp "s3://$R2_BACKUP_BUCKET/$allowlist_key" "$restore_dir/cleanup-allowlist.json" \
              --endpoint-url "$R2_BACKUP_ENDPOINT" --only-show-errors >/dev/null 2>&1 ||
              [[ ! -s "$restore_dir/cleanup-allowlist.json" ]]; then
              echo 'The reviewed private cleanup allowlist for the selected release is unavailable or empty.' >&2
              exit 1
            fi
            if [[ "$(sha256sum "$restore_dir/cleanup-allowlist.json" | cut -d ' ' -f1)" != "$ALLOWLIST_SHA256" ]]; then
              echo 'The private cleanup allowlist differs from the reviewed file.' >&2
              exit 1
            fi
          fi
          echo "Verifying the selected manifest: $key" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore and compare in an isolated PostgreSQL container
        shell: bash
        env:
          RELEASE_CANDIDATE: ${{ inputs.release_candidate_sha }}
          BACKUP_REQUIRE_ASSETS: ${{ inputs.require_assets && 'true' || 'false' }}
          BACKUP_REPLAY_CANDIDATE: ${{ inputs.replay_candidate && 'true' || 'false' }}
          PREVIEW_CLEANUP: ${{ inputs.preview_cleanup }}
          BACKUP_RETAIN_ALL_CLEANUP: ${{ inputs.retain_all_cleanup && 'true' || 'false' }}
          BACKUP_CLEANUP_PREVIEW_REPORT: ''
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_READ_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_READ_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          if [[ "$BACKUP_REPLAY_CANDIDATE" == true ]]; then
            export BACKUP_CANDIDATE_CHECKOUT="$GITHUB_WORKSPACE/release-candidate"
          fi
          if [[ "$PREVIEW_CLEANUP" == true ]]; then
            export BACKUP_REVIEWED_CLEANUP_ALLOWLIST="$RESTORE_DIR/cleanup-allowlist.json"
          fi
          bash scripts/backup/verify-isolated-restore.sh \
            "$MANIFEST_PATH" "$DUMP_PATH" "$DUMP_KEY" "$RELEASE_CANDIDATE" |
            tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove local backup copies
        if: always()
        shell: bash
        run: |
          if [[ -n "${RESTORE_DIR:-}" ]]; then
            rm -f -- "$MANIFEST_PATH" "$DUMP_PATH" "$RESTORE_DIR/cleanup-allowlist.json"
            rmdir -- "$RESTORE_DIR"
          fi

      - name: Notify on failure
        if: failure()
        env:
          INCIDENT_WEBHOOK: ${{ secrets.BETTER_STACK_INCIDENT_WEBHOOK }}
        run: |
          if [[ -z "$INCIDENT_WEBHOOK" ]]; then
            echo '::warning title=Notification unavailable::The restore check failed and no Better Stack incident webhook is configured.'
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 10 "$INCIDENT_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d '{"title":"Monthly isolated restore verification failed","severity":"high"}'
