name: Dependabot Lockfile Sync

# ---------------------------------------------------------------------------
# Why this exists
# ---------------------------------------------------------------------------
# The repo installs with `bun install --frozen-lockfile` in every CI job
# (.github/workflows/ci.yml). Dependabot's bun ecosystem support bumps the
# package.json manifests but does NOT regenerate the text lockfile `bun.lock`.
# Frozen install then correctly aborts with:
#
#   error: lockfile had changes, but lockfile is frozen
#
# so no Dependabot PR can ever go green. This workflow closes that gap: on a
# Dependabot PR it regenerates `bun.lock` against the updated manifests and
# commits it back to the PR branch, after which CI can pass.
#
# Validation of the new commit:
#   pull_request synchronize events from GITHUB_TOKEN create runs that require
#   maintainer approval. Approve the workflows on the NEW SHA after reviewing
#   the lockfile; rerunning an older failed run does not validate this commit.
#   To get CI to run automatically, use a fine-scoped PAT as a *Dependabot*
#   secret named LOCKFILE_SYNC_TOKEN (Settings → Secrets and variables →
#   Dependabot). With it, the push triggers a fresh CI run on the new commit.
#   Without it, a maintainer must approve the pending workflows. Never merge
#   based on the old SHA's checks or relax the repository's approval policy.
# ---------------------------------------------------------------------------

on:
  pull_request:
    branches: [dev, test, pprd, prod]

# Least privilege: only what the commit-back needs.
permissions:
  contents: write

concurrency:
  group: lockfile-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-lockfile:
    # Only Dependabot PRs — never touches human-authored branches.
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          # A PAT (added as a Dependabot secret) makes the follow-up push
          # run CI automatically. GITHUB_TOKEN still commits the lockfile, but
          # the resulting pull_request workflows require maintainer approval.
          token: ${{ secrets.LOCKFILE_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      # No `bun-version`: the lockfile must be regenerated by the same Bun the
      # rest of CI uses, and CI floats to latest. A pin here would write a
      # lockfile with a different Bun than the one that then verifies it.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Regenerate bun.lock against updated manifests
        # Rewrites bun.lock to satisfy the bumped package.json files. No
        # --frozen-lockfile here — updating the lockfile is the point.
        # --ignore-scripts: lockfile resolution never needs dependency
        # postinstall scripts, so we don't execute arbitrary package code while
        # a write-capable token is in the job environment (supply-chain hardening).
        run: bun install --ignore-scripts

      - name: Commit & push synced lockfile (only if it changed)
        # HEAD_REF is passed via env (not interpolated into the script) so an
        # attacker-influenceable branch name can't inject shell — GitHub Actions
        # expression-injection hardening.
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already in sync with the updated manifests — nothing to do."
            exit 0
          fi
          # Attribute to Dependabot and include [dependabot skip] so Dependabot
          # keeps managing/rebasing the PR (it otherwise stops once a non-bot
          # commit lands).
          git config user.name  "dependabot[bot]"
          git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(deps): sync bun.lock for Dependabot update [dependabot skip]"
          git push origin "HEAD:$HEAD_REF"
          echo "Pushed synced bun.lock to $HEAD_REF."
