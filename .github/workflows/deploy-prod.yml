# ============================================================================
#  Deploy Production — Customer site (apps/web → Cloudflare Workers via OpenNext)
#  Target: https://theroyalglow.in   ·   Worker: rgss-web
# ============================================================================
#
#  WHAT CHANGED (Pages → Workers / OpenNext migration)
#  ---------------------------------------------------
#  Previously this deployed `apps/web/.next` to Cloudflare *Pages*
#  (`pages deploy`). Plain Pages cannot run full Next.js SSR/middleware/API, so
#  we now build with the OpenNext adapter (`@opennextjs/cloudflare`) and deploy
#  the generated Worker (`.open-next/worker.js`) to Cloudflare *Workers* with
#  `wrangler deploy` (config in `apps/web/wrangler.jsonc`).
#
#  ONE-TIME MANUAL CLOUDFLARE SETUP (must be done before the first prod deploy)
#  ---------------------------------------------------------------------------
#   1. Create the Worker `rgss-web` (the first `wrangler deploy` creates it).
#   2. Attach the custom domain `theroyalglow.in` to the Worker
#      (Workers → rgss-web → Settings → Domains & Routes). Detach it from the
#      old Pages project first to avoid a routing conflict.
#   3. Provision RUNTIME secrets on the Worker (NOT build vars), e.g.:
#         wrangler secret put DATABASE_URL            --name rgss-web
#         wrangler secret put BETTER_AUTH_SECRET       --name rgss-web
#         wrangler secret put RESEND_API_KEY           --name rgss-web
#         wrangler secret put ABLY_PRIVATE_KEY         --name rgss-web
#         wrangler secret put QSTASH_TOKEN             --name rgss-web
#         ... (every server secret in environment-variables.md)
#   4. Set the NEXT_PUBLIC_* BUILD variables as GitHub Actions repo/env vars
#      (see the "Build" step env block below) — these are inlined by `next build`
#      and therefore must exist at BUILD time, not just at runtime.
#
#  REQUIRED GITHUB SECRETS
#    CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
#    SENTRY_ORG, SENTRY_PROJECT, SENTRY_AUTH_TOKEN,
#    DATABASE_URL_UNPOOLED_PROD (DDL migrations over the direct conn),
#    BETTER_STACK_DEPLOY_WEBHOOK, BETTER_STACK_INCIDENT_WEBHOOK
#  NOTE: QStash schedule registration was MOVED to deploy-admin-prod.yml (the
#  jobs surface now lives in apps/admin). This workflow no longer needs the
#  QSTASH_TOKEN GitHub secret; the web Worker still carries QSTASH_TOKEN as a
#  RUNTIME secret (via `wrangler secret`) for its best-effort booking enqueue.
# ============================================================================
name: Deploy Production

on:
  push:
    branches: [prod]

jobs:
  # --------------------------------------------------------------------------
  # Gate: only deploy a commit whose CI checks are all green.
  # --------------------------------------------------------------------------
  pre-deploy-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the CI workflow to pass for this commit
        run: |
          # deploy-prod triggers on the SAME push as CI, so CI is usually still
          # running when this gate starts — a single-shot read returns
          # "missing" and false-fails. Poll the CI workflow's run for THIS sha
          # until it completes (max ~15 min), then require success. Scoped to
          # ci.yml so concurrent sibling deploy runs never cross-fail the gate.
          for i in $(seq 1 60); do
            RUN=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&per_page=1" \
              --jq '.workflow_runs[0] // {} | "\(.status) \(.conclusion)"')
            STATUS=$(echo "$RUN" | awk '{print $1}')
            CONCLUSION=$(echo "$RUN" | awk '{print $2}')
            echo "attempt $i: status=${STATUS:-none} conclusion=${CONCLUSION:-none}"
            if [ "$STATUS" = "completed" ]; then
              test "$CONCLUSION" = "success"
              exit $?
            fi
            sleep 15
          done
          echo "Timed out waiting for CI to complete"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------------
  # Migrate FIRST: apply committed Drizzle migrations to the prod Neon branch
  # over the UNPOOLED (direct) connection — DDL must not go through pgBouncer.
  # (Fixes the previously-broken `bun run db:migrate`, which never existed at
  # the repo root; the real script lives in packages/db as `migrate`.)
  # Runs before the Worker deploy so the new code never hits an old schema.
  # --------------------------------------------------------------------------
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [pre-deploy-checks]
    # Environment declaration is REQUIRED for this job to read the
    # `production` environment secret DATABASE_URL_UNPOOLED_PROD. Without it
    # the secret resolves empty and drizzle-kit fails with url: ''.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply DB migrations (unpooled, DDL)
        working-directory: packages/db
        run: bun run migrate
        env:
          # drizzle.config / migrate read the unpooled URL for DDL.
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED_PROD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED_PROD }}

      # NOTE: there is no pg_cron apply step. The 6 jobs that were originally
      # planned as pg_cron (nightly sales summary, membership/offer/gems
      # auto-expire, session cleanup, monthly GST summary) now run as QStash
      # scheduled HTTP jobs (registered by the post-deploy "Register QStash
      # schedules" step) instead. Reason: the free-tier prod compute scales to
      # zero after ~5 min idle, and pg_cron only fires while the compute is
      # awake — the late-night windows would silently never run. QStash POSTs an
      # endpoint that WAKES the compute, so the jobs run reliably at ₹0. See
      # background-jobs.md (Architecture Decision: pg_cron → QStash).

  # --------------------------------------------------------------------------
  # Build the OpenNext Worker bundle and deploy it to Cloudflare Workers.
  # --------------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [migrate]
    environment:
      name: production
      url: https://theroyalglow.in
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # OpenNext build: runs `next build` then emits `.open-next/worker.js` +
      # `.open-next/assets`. NEXT_PUBLIC_* are inlined here, so they must be
      # present in this step's env (sourced from GitHub repo/environment vars).
      - name: Build (OpenNext → Cloudflare Worker)
        working-directory: apps/web
        run: bunx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_ADMIN_URL: ${{ vars.NEXT_PUBLIC_ADMIN_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_ABLY_KEY: ${{ vars.NEXT_PUBLIC_ABLY_KEY }}
          NEXT_PUBLIC_META_PIXEL_ID: ${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_CMS_URL: ${{ vars.NEXT_PUBLIC_CMS_URL }}
          NEXT_PUBLIC_R2_PUBLIC_URL: ${{ vars.NEXT_PUBLIC_R2_PUBLIC_URL }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_CLARITY_ID: ${{ vars.NEXT_PUBLIC_CLARITY_ID }}
          # Server-only secrets are NOT needed at build (the Worker reads them
          # at runtime from `wrangler secret`); skip strict env validation so a
          # missing server secret can't fail the build-time inlining step.
          SKIP_ENV_VALIDATION: '1'

      # Best-effort Sentry client source-map upload (no-op without the token).
      - name: Upload source maps to Sentry
        continue-on-error: true
        run: |
          bunx @sentry/cli sourcemaps upload \
            --org ${{ secrets.SENTRY_ORG }} \
            --project ${{ secrets.SENTRY_PROJECT }} \
            --release ${{ github.sha }} \
            apps/web/.next/static apps/web/.open-next
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # Deploy the built Worker. wrangler reads apps/web/wrangler.jsonc (main =
      # .open-next/worker.js) and publishes to the `rgss-web` Worker + its
      # attached custom domain.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          packageManager: bun
          command: deploy

  # --------------------------------------------------------------------------
  # Post-deploy verification: health + critical-path smoke against the live site.
  # --------------------------------------------------------------------------
  post-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Health check (retry 3x with 10s delay)
        run: |
          for i in 1 2 3; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 30 https://theroyalglow.in/api/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Health check failed (attempt $i, status: $STATUS). Retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 3 attempts"
          exit 1

      - name: Smoke test critical paths
        run: |
          curl -sf https://theroyalglow.in/ > /dev/null
          curl -sf "https://theroyalglow.in/?book=1&utm_source=gmb" > /dev/null
          curl -sf https://theroyalglow.in/services > /dev/null
          curl -sf https://theroyalglow.in/book > /dev/null
          curl -sf https://theroyalglow.in/api/health > /dev/null
          echo "All smoke tests passed"

      # ----------------------------------------------------------------------
      # NOTE: QStash schedule registration was MOVED to deploy-admin-prod.yml.
      # The background-jobs surface now lives in apps/admin (served from
      # admin.theroyalglow.in/api/jobs/*), so the schedules must be registered
      # against the admin origin from the admin deploy. The web Worker keeps its
      # QSTASH_TOKEN runtime secret only for the best-effort booking enqueue
      # (POST /api/bookings → triggered jobs on the admin origin).
      # ----------------------------------------------------------------------

      - name: Notify deployment success
        if: success()
        run: |
          if [ -n "${{ secrets.BETTER_STACK_DEPLOY_WEBHOOK }}" ]; then
            curl -X POST "${{ secrets.BETTER_STACK_DEPLOY_WEBHOOK }}" \
              -H "Content-Type: application/json" \
              -d '{"sha": "${{ github.sha }}", "status": "success", "env": "prod"}'
          else
            echo "BETTER_STACK_DEPLOY_WEBHOOK not set — skipping deploy notification"
          fi

  # --------------------------------------------------------------------------
  # REAL auto-rollback: `wrangler rollback` re-points the Worker at its previous
  # deployment version (the old step only *listed* deployments and rolled back
  # nothing). Workers keeps prior versions, so this is an instant revert.
  # --------------------------------------------------------------------------
  auto-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [post-deploy]
    if: failure()
    # REQUIRED to read the `production` environment secret CLOUDFLARE_API_TOKEN
    # (and ACCOUNT_ID). Without it wrangler rollback errors: "necessary to set
    # a CLOUDFLARE_API_TOKEN environment variable".
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Roll back the Worker to its previous version
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          packageManager: bun
          command: 'rollback --message "Auto-rollback prod health/smoke failed for ${{ github.sha }}"'
      - name: Notify deployment failure
        run: |
          if [ -n "${{ secrets.BETTER_STACK_INCIDENT_WEBHOOK }}" ]; then
            curl -X POST "${{ secrets.BETTER_STACK_INCIDENT_WEBHOOK }}" \
              -H "Content-Type: application/json" \
              -d '{"title": "Production deploy failed — rolled back", "sha": "${{ github.sha }}"}'
          else
            echo "BETTER_STACK_INCIDENT_WEBHOOK not set — skipping incident notification"
          fi
