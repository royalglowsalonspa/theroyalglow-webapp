# ============================================================================
#  Deploy Pre-Production (pprd) — Customer site (apps/web → Cloudflare Workers)
#  Target: https://pprd.theroyalglow.in   ·   Worker: rgss-web-pprd
# ============================================================================
#
#  PURPOSE
#  -------
#  Pre-production staging tier for the customer site. Mirrors deploy-prod.yml
#  but deploys to the isolated `pprd` Worker (`wrangler deploy --env pprd`,
#  config in apps/web/wrangler.jsonc) against the pprd Neon branch. Use it to
#  smoke a release on real Cloudflare infra before promoting `pprd → prod`.
#
#  ISOLATION
#  ---------
#  pprd lives on `pprd.theroyalglow.in` with its session cookie scoped to
#  `.pprd.theroyalglow.in`, so it can never collide with the prod
#  `.theroyalglow.in` cookie. Admin pprd nests at `admin.pprd.theroyalglow.in`
#  so web+admin share the one pprd cookie scope.
#
#  ONE-TIME SETUP (before the first pprd deploy)
#  ---------------------------------------------
#   1. First `wrangler deploy --env pprd` creates the `rgss-web-pprd` Worker;
#      attach the custom domain `pprd.theroyalglow.in` to it.
#   2. Provision RUNTIME secrets on rgss-web-pprd (point DB at the pprd Neon
#      branch): DATABASE_URL, BETTER_AUTH_SECRET (must match rgss-admin-pprd),
#      RESEND_API_KEY, ABLY_PRIVATE_KEY, QSTASH_TOKEN, UPSTASH_*, R2_*, etc.
#   3. Create a GitHub Environment named `pprd` carrying the NEXT_PUBLIC_* build
#      VARS (pprd URLs) and the DATABASE_URL_UNPOOLED_PPRD secret.
#   4. Add the pprd subdomains to Google OAuth authorized origins/redirects.
#
#  REQUIRED GITHUB SECRETS (in the `pprd` environment unless noted)
#    CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (repo-level ok),
#    DATABASE_URL_UNPOOLED_PPRD (DDL migrations over the direct conn),
#    BETTER_STACK_DEPLOY_WEBHOOK (optional)
# ============================================================================
name: Deploy Pre-Production (web)

on:
  push:
    branches: [pprd]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/deploy-pprd.yml'

jobs:
  # --------------------------------------------------------------------------
  # Apply committed Drizzle migrations to the pprd Neon branch (unpooled, DDL).
  # Both web + admin share packages/db, so migrations are applied once here.
  # --------------------------------------------------------------------------
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pprd
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply DB migrations (unpooled, DDL) to pprd
        working-directory: packages/db
        run: bun run migrate
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED_PPRD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED_PPRD }}

  # --------------------------------------------------------------------------
  # Build the OpenNext Worker bundle and deploy it to the pprd Worker.
  # --------------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [migrate]
    environment:
      name: pprd
      url: https://pprd.theroyalglow.in
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Build (OpenNext → Cloudflare Worker)
        working-directory: apps/web
        run: bunx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_ADMIN_URL: ${{ vars.NEXT_PUBLIC_ADMIN_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_ABLY_KEY: ${{ vars.NEXT_PUBLIC_ABLY_KEY }}
          NEXT_PUBLIC_META_PIXEL_ID: ${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_CMS_URL: ${{ vars.NEXT_PUBLIC_CMS_URL }}
          NEXT_PUBLIC_R2_PUBLIC_URL: ${{ vars.NEXT_PUBLIC_R2_PUBLIC_URL }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_CLARITY_ID: ${{ vars.NEXT_PUBLIC_CLARITY_ID }}
          SKIP_ENV_VALIDATION: '1'

      # Deploy to the pprd Worker (apps/web/wrangler.jsonc → env.pprd).
      - name: Deploy to Cloudflare Workers (pprd)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          packageManager: bun
          command: deploy --env pprd

  # --------------------------------------------------------------------------
  # Post-deploy health + smoke against the live pprd site.
  # --------------------------------------------------------------------------
  post-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy]
    steps:
      - name: Health check (retry 3x with 10s delay)
        run: |
          for i in 1 2 3; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 30 https://pprd.theroyalglow.in/api/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Health check failed (attempt $i, status: $STATUS). Retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 3 attempts"
          exit 1

      - name: Smoke test critical paths
        run: |
          curl -sf https://pprd.theroyalglow.in/ > /dev/null
          curl -sf https://pprd.theroyalglow.in/services > /dev/null
          curl -sf https://pprd.theroyalglow.in/api/health > /dev/null
          echo "All smoke tests passed"

  # --------------------------------------------------------------------------
  # Auto-rollback the pprd Worker to its previous version on a failed check.
  # --------------------------------------------------------------------------
  auto-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [post-deploy]
    if: failure()
    # REQUIRED to read the `pprd` environment secret CLOUDFLARE_API_TOKEN
    # (and ACCOUNT_ID) for wrangler rollback.
    environment: pprd
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Roll back the pprd Worker to its previous version
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          packageManager: bun
          command: 'rollback --env pprd --message "Auto-rollback pprd health/smoke failed for ${{ github.sha }}"'
