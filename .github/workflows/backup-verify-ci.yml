name: Backup Script Verification

on:
  pull_request:
    paths:
      - '.github/workflows/backup-verify-ci.yml'
      - '.github/workflows/monthly-backup-test.yml'
      - '.github/workflows/pre-migration-backup.yml'
      - '.github/workflows/weekly-backup.yml'
      - 'scripts/backup/**'

permissions:
  contents: read

jobs:
  backup-round-trip:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_PASSWORD: local-ci-fixture-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      BACKUP_SOURCE_ID: local-ci-fixture
      BACKUP_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Test R2 storage preflight with fixture credentials
        run: bash scripts/backup/verify-r2-backup-access.test.sh
      - name: Test cleanup and recovered asset verification
        run: >-
          bun test scripts/backup/preview-cleanup.test.mjs scripts/backup/verify-recovered-assets.test.mjs
          scripts/backup/release-backup-assets.test.mjs
      - name: Select preinstalled PostgreSQL 18 tools
        run: |
          test -x /usr/lib/postgresql/18/bin/pg_dump
          echo '/usr/lib/postgresql/18/bin' >> "$GITHUB_PATH"
      - name: Exercise capture, isolated restore and manifest verification
        shell: bash
        env:
          BACKUP_DATABASE_URL: postgresql://postgres:local-ci-fixture-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres
          BACKUP_OUTPUT_DIR: ${{ runner.temp }}/backup-round-trip
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 "$BACKUP_DATABASE_URL" <<'SQL'
          CREATE EXTENSION btree_gist;
          CREATE SCHEMA drizzle;
          CREATE SCHEMA cms;
          CREATE TABLE drizzle.__drizzle_migrations (id integer PRIMARY KEY, hash text, created_at bigint);
          CREATE TABLE cms.payload_migrations (id integer PRIMARY KEY, name text);
          CREATE TABLE cms.media (id integer PRIMARY KEY, filename text, sizes_card_filename text);
          CREATE TABLE invoice (id text PRIMARY KEY, total_amount_paise bigint, gst_amount_paise bigint, payment_status text, pdf_url text);
          CREATE TABLE spa_membership (id text PRIMARY KEY, total_hours_minutes integer, used_hours_minutes integer, reserved_minutes integer);
          INSERT INTO drizzle.__drizzle_migrations VALUES (1, 'fixture hash', 1793437989956);
          INSERT INTO cms.payload_migrations VALUES (1, 'fixture migration');
          INSERT INTO cms.media VALUES (1, 'example.jpg', 'example-card.jpg');
          INSERT INTO invoice VALUES ('INV-1', 10500, 500, 'paid', 'https://example.invalid/invoice.pdf');
          INSERT INTO spa_membership VALUES ('MEM-1', 120, 45, 15);
          SQL
          stem=$(bash scripts/backup/capture-full.sh)
          manifest="$BACKUP_OUTPUT_DIR/$stem.manifest.json"
          dump="$BACKUP_OUTPUT_DIR/$stem.dump"
          jq -e '.facts.paidInvoicePaise == "10500" and
            .facts.sums["public.spa_membership.reserved_minutes"] == "15" and
            .facts.objectReferences["cms.media.sizes_card_filename"].count == "1"' "$manifest"
          bash scripts/backup/verify-isolated-restore.sh "$manifest" "$dump"
          jq '.facts.counts["public.invoice"] = "0"' "$manifest" > "$BACKUP_OUTPUT_DIR/incorrect.json"
          if bash scripts/backup/verify-isolated-restore.sh "$BACKUP_OUTPUT_DIR/incorrect.json" "$dump"; then
            echo 'The restore accepted an incorrect manifest.' >&2
            exit 1
          fi
          export BACKUP_KEY_PREFIX=release
          export BACKUP_RELEASE_CANDIDATE_COMMIT="$BACKUP_SOURCE_COMMIT"
          export BACKUP_SOURCE_DEPLOYED_COMMIT='1111111111111111111111111111111111111111'
          export BACKUP_SOURCE_NEON_BRANCH_ID=br-local-ci-fixture
          export BACKUP_SOURCE_NEON_HOST=ep-local-ci-fixture.ap-southeast-1.aws.neon.tech
          if bash scripts/backup/capture-full.sh; then
            echo 'A release backup accepted an unreviewed database host.' >&2
            exit 1
          fi
          # This synthetic hostname resolves only to the CI service on loopback.
          printf '127.0.0.1 %s\n' "$BACKUP_SOURCE_NEON_HOST" | sudo tee -a /etc/hosts >/dev/null
          export BACKUP_DATABASE_URL="${BACKUP_DATABASE_URL/127.0.0.1/$BACKUP_SOURCE_NEON_HOST}"
          export BACKUP_RUN_ID="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          release_stem=$(BACKUP_CAPTURE_ASSETS=true bash scripts/backup/capture-full.sh)
          release_manifest="$BACKUP_OUTPUT_DIR/$release_stem.manifest.json"
          release_dump="$BACKUP_OUTPUT_DIR/$release_stem.dump"
          release_key="release/$release_stem.dump"
          jq -e --arg branch "$BACKUP_SOURCE_NEON_BRANCH_ID" --arg host "$BACKUP_SOURCE_NEON_HOST" \
            --arg source "$BACKUP_SOURCE_COMMIT" --arg deployed "$BACKUP_SOURCE_DEPLOYED_COMMIT" \
            '.sourceCommit == $source and .sourceDeployedCommit == $deployed and
              .sourceNeonHost == $host and .sourceNeonBranchId == $branch' "$release_manifest"
          jq -e 'any(.[]; .kind == "cms.media.filename" and
            (.pair | fromjson) == [1, "example.jpg"])' "$BACKUP_OUTPUT_DIR/$release_stem.references.json"
          if bash scripts/backup/verify-isolated-restore.sh "$release_manifest" "$release_dump" \
            "$release_key" "$BACKUP_SOURCE_DEPLOYED_COMMIT"; then
            echo 'The restore accepted a release backup for a different candidate.' >&2
            exit 1
          fi
          bash scripts/backup/verify-isolated-restore.sh "$release_manifest" "$release_dump" \
            "$release_key" "$BACKUP_RELEASE_CANDIDATE_COMMIT"
          if BACKUP_REQUIRE_ASSETS=true bash scripts/backup/verify-isolated-restore.sh \
            "$release_manifest" "$release_dump" "$release_key" "$BACKUP_RELEASE_CANDIDATE_COMMIT"; then
            echo 'Strict verification accepted a legacy backup with no asset inventory.' >&2
            exit 1
          fi

          # Start from the first Drizzle schema with an exact test record and no
          # Payload ledger. Replay the remaining migrations on the copy only.
          psql -X -v ON_ERROR_STOP=1 "$BACKUP_DATABASE_URL" -c 'CREATE DATABASE backup_replay_fixture'
          export BACKUP_DATABASE_URL="${BACKUP_DATABASE_URL%/postgres}/backup_replay_fixture"
          journal=packages/db/migrations/meta/_journal.json
          first_tag=$(jq -er '.entries[0].tag' "$journal")
          first_time=$(jq -er '.entries[0].when' "$journal")
          first_migration="packages/db/migrations/$first_tag.sql"
          first_hash=$(sha256sum "$first_migration" | cut -d ' ' -f1)
          psql -X -v ON_ERROR_STOP=1 "$BACKUP_DATABASE_URL" -f "$first_migration" >/dev/null
          psql -X -v ON_ERROR_STOP=1 "$BACKUP_DATABASE_URL" \
            -v migration_hash="$first_hash" -v migration_time="$first_time" <<'SQL'
          CREATE SCHEMA drizzle;
          CREATE TABLE drizzle.__drizzle_migrations (id serial PRIMARY KEY, hash text NOT NULL, created_at bigint);
          INSERT INTO drizzle.__drizzle_migrations (hash, created_at) VALUES (:'migration_hash', :'migration_time');
          INSERT INTO public.lead (id, name, phone) VALUES ('cleanup-fixture-private-id', 'Test lead', '0000000000');
          SQL
          export BACKUP_RUN_ID="$GITHUB_RUN_ID-$((GITHUB_RUN_ATTEMPT + 1000))"
          replay_stem=$(BACKUP_CAPTURE_ASSETS=true bash scripts/backup/capture-full.sh)
          replay_manifest="$BACKUP_OUTPUT_DIR/$replay_stem.manifest.json"
          replay_dump="$BACKUP_OUTPUT_DIR/$replay_stem.dump"
          allowlist="$BACKUP_OUTPUT_DIR/$replay_stem.cleanup-allowlist.json"
          jq -n --arg dumpSha256 "$(jq -er '.dumpSha256' "$replay_manifest")" '
            {version: 1, dumpSha256: $dumpSha256, reviewReference: "fixture-private-review", rows: [
              {table: "public.lead", key: {id: "cleanup-fixture-private-id"}, evidenceReference: "fixture-private-evidence"}
            ]}
          ' > "$allowlist"
          replay_status=0
          replay_output=$(BACKUP_CANDIDATE_CHECKOUT="$GITHUB_WORKSPACE" BACKUP_REVIEWED_CLEANUP_ALLOWLIST="$allowlist" \
            bash scripts/backup/verify-isolated-restore.sh "$replay_manifest" "$replay_dump" \
              "release/$replay_stem.dump" "$BACKUP_RELEASE_CANDIDATE_COMMIT" 2>&1) || replay_status=$?
          if [[ "$replay_output" == *fixture-private-* ]]; then
            echo 'The cleanup preview printed private fixture details.' >&2
            exit 1
          fi
          if [[ "$replay_status" != 0 ]]; then
            printf '%s\n' "$replay_output" >&2
            exit "$replay_status"
          fi
          grep -Fx 'Restored catalogue check. Categories CMS 0, public 0. Services CMS 0, public 0. Offers CMS 0, public 0. Findings 0.' <<< "$replay_output"
          grep -Fx 'Cleanup preview status database_review_complete. Selected 1. Missing 0. Unreviewed dependencies 0.' <<< "$replay_output"

          retain_restore=(bash scripts/backup/verify-isolated-restore.sh "$replay_manifest" "$replay_dump"
            "release/$replay_stem.dump" "$BACKUP_RELEASE_CANDIDATE_COMMIT")
          export BACKUP_RETAIN_ALL_CLEANUP=true BACKUP_REQUIRE_ASSETS=true
          export BACKUP_CANDIDATE_CHECKOUT="$GITHUB_WORKSPACE"
          if BACKUP_REVIEWED_CLEANUP_ALLOWLIST="$allowlist" "${retain_restore[@]}"; then
            echo 'The retain-all restore accepted a conflicting cleanup allowlist.' >&2
            exit 1
          fi
          if "${retain_restore[@]}"; then
            echo 'The retain-all restore accepted a release backup without verified assets.' >&2
            exit 1
          fi

          # Capture the fixture's empty asset inventory and serve only its exact key.
          fixture_asset_bundle="$BACKUP_OUTPUT_DIR/fixture-assets"
          node scripts/backup/release-backup-assets.mjs capture "$replay_manifest" \
            "$BACKUP_OUTPUT_DIR/$replay_stem.references.json" "$fixture_asset_bundle"
          fixture_bin="$BACKUP_OUTPUT_DIR/fixture-bin"
          mkdir -- "$fixture_bin"
          cat > "$fixture_bin/aws" <<'AWS'
          #!/usr/bin/env bash
          set -euo pipefail
          [[ "$1" == s3 && "$2" == cp && "$3" == "$FIXTURE_INVENTORY_URL" ]]
          cp -- "$FIXTURE_INVENTORY_PATH" "$4"
          AWS
          chmod +x "$fixture_bin/aws"
          retain_output=$(PATH="$fixture_bin:$PATH" R2_BACKUP_BUCKET=rgss-backups \
            R2_BACKUP_ENDPOINT=https://11111111111111111111111111111111.r2.cloudflarestorage.com \
            FIXTURE_INVENTORY_URL="s3://rgss-backups/release/$replay_stem.assets/inventory.json" \
            FIXTURE_INVENTORY_PATH="$fixture_asset_bundle/inventory.json" "${retain_restore[@]}")
          grep -Fx 'Cleanup disposition retain_all. Selected 0. Missing 0. Unreviewed dependencies 0.' <<< "$retain_output"
          test "$(psql -X -v ON_ERROR_STOP=1 "$BACKUP_DATABASE_URL" -tAc \
            "SELECT (SELECT count(*) FROM drizzle.__drizzle_migrations) = 1
              AND to_regclass('cms.payload_migrations') IS NULL
              AND EXISTS (SELECT 1 FROM public.lead WHERE id = 'cleanup-fixture-private-id')")" = t
