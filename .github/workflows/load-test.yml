name: Load & Security

# Exercise the checked-out web build on loopback using runner-local synthetic
# data. The k6 results measure this build on the runner, outside the deployed
# AWS, CDN and Neon network path.

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [dev, test, pprd, prod]

permissions:
  contents: read

jobs:
  web-runtime-checks:
    name: Web load and passive security checks
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/synthetic-postgres
      - uses: grafana/setup-k6-action@v1
      - name: Build and start the synthetic web app
        id: web
        env:
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          export DATABASE_URL="${DATABASE_URL/127.0.0.1/localhost}"
          export NODE_OPTIONS="--import=$RGSS_LOCAL_DB_PRELOAD"
          bun run --filter @rgss/web build
          bun run --filter @rgss/web start --hostname 127.0.0.1 > "$RUNNER_TEMP/rgss-load-web.log" 2>&1 &
          web_pid=$!
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:3000/api/health |
              jq -e --arg sha "$COMMIT_SHA" '.version == $sha and .checks.database.status == "pass"' >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$web_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/rgss-load-web.log"
          exit 1

      - name: Run the booking read-path load test
        run: k6 run tests/load/booking-flow.js

      - name: Run OWASP ZAP passive response checks
        if: ${{ !cancelled() && steps.web.outcome == 'success' }}
        shell: bash
        run: |
          install -d -m 0777 "$RUNNER_TEMP/rgss-zap"
          docker run --rm --network host \
            --mount "type=bind,source=$GITHUB_WORKSPACE/tests/load/passive-scan.yml,target=/zap/rgss-plan.yml,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/rgss-zap,target=/zap/rgss-report" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -cmd -host 127.0.0.1 -port 8090 -autorun /zap/rgss-plan.yml

      - name: Upload load server and passive scan diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: web-runtime-checks
          path: |
            ${{ runner.temp }}/rgss-load-web.log
            ${{ runner.temp }}/rgss-zap/
          retention-days: 7

  # Dependency/filesystem scanning needs no deployed environment — always gates.
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      # Pinned to a RELEASE rather than @master. Tracking master broke this job:
      # a newer setup-trivy rejected the action's own cache-dir input ("The 'path'
      # input must be a literal path") and the scan aborted with docker exit 3.
      # An unpinned third-party action is also an avoidable supply-chain risk.
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          # Vendored dependencies are covered by the dependency-audit gate
          # (bun audit) against the lockfile; scanning them here only produces
          # duplicate findings and long runtimes.
          skip-dirs: 'node_modules,.next,.turbo,.open-next'

  load-security-success:
    name: Load & Security Success
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always()
    needs: [web-runtime-checks, security-scan]
    steps:
      - name: Verify load and security jobs
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          if jq -e 'all(. == "success")' <<< "$RESULTS" >/dev/null; then
            echo "Load and security checks passed."
          else
            echo "A load or security check failed, was cancelled, or was skipped: $RESULTS"
            exit 1
          fi
