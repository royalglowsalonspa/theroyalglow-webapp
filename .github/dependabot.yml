# Dependabot configuration for theroyalglow-webapp (Bun + Turborepo monorepo).
#
# Coverage
# - The Bun entry starts at the root package.json and follows its workspaces
#   (apps/* and packages/*), updating their manifests and shared bun.lock together.
#   Do not scan workspace directories separately: that duplicates the root update
#   and creates competing PRs for the same dependency and lockfile.
# - No `allow` list is used, so every direct registry dependency is discovered.
#   Frozen-lockfile installs in CI validate Dependabot's committed lockfile.
# - The Docker entry scans the active Cloud Run invoicing Dockerfile. The legacy
#   CMS/Koyeb and retired EC2 Dockerfiles are deliberately excluded.
# - The GitHub Actions entry scans every external action in .github/workflows/.
# - Root package.json `overrides`, the `packageManager` Bun runtime version,
#   Render's BUN_VERSION, and package JSON generated inside a Dockerfile are not
#   updateable by Dependabot. CI checks override drift; runtime pins and generated
#   manifests need deliberate maintenance.
#
# Policy
# - PRs target dev and move through dev -> test -> pprd -> prod like normal work.
# - Coupled/high-impact families get focused PRs. Remaining minor/patch updates
#   are grouped into production and development batches to keep maintenance small.
# - Majors outside an explicit ignore are standalone PRs across the workspace.
#   Framework majors under `ignore` are deliberate manual migrations.
# - Dependabot proposes stable releases; prereleases are considered only when the
#   project already uses one.
#
# Docs: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2

updates:
  # ---------------------------------------------------------------------------
  # One Bun project: root manifest, declared workspaces, and one shared lockfile.
  # The Bun updater discovers workspace manifests from the root automatically.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "bun"
    directory: "/"
    target-branch: "dev"
    schedule:
      # Monday, Wednesday and Friday at 12:00 IST = 06:30 UTC (IST is UTC+5:30).
      # Cron schedules run in UTC because no timezone is set.
      interval: "cron"
      cronjob: "30 6 * * 1,3,5"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      # Vitest and its coverage provider share internal APIs. Keep even major
      # upgrades synchronized across every workspace.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - "major"
          - "minor"
          - "patch"

      # Authentication schema and sessions are shared across web/admin.
      better-auth:
        patterns:
          - "better-auth"
          - "@better-auth/*"
        update-types:
          - "minor"
          - "patch"

      # Payload packages must remain on one compatible release family.
      payload:
        patterns:
          - "payload"
          - "@payloadcms/*"
          - "graphql"
        update-types:
          - "minor"
          - "patch"

      # Next.js and React compatibility must be reviewed together.
      next-react:
        patterns:
          - "next"
          - "@next/*"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"

      # Keep the Hono framework and its Node runtime adapter together.
      hono:
        patterns:
          - "hono"
          - "@hono/*"
        update-types:
          - "minor"
          - "patch"

      # One focused PR keeps Tailwind core and adapters aligned.
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
        update-types:
          - "minor"
          - "patch"

      # Catch every remaining direct dependency. Examples include Sharp, Motion,
      # Radix UI, AWS SDK, Neon, Upstash, Resend, Ably, Turbo, and TypeScript.
      production-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Framework-critical majors need dedicated migration work. Minor/patch
      # releases continue through the focused groups above.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "drizzle-orm"
        update-types: ["version-update:semver-major"]
      - dependency-name: "drizzle-kit"
        update-types: ["version-update:semver-major"]
      - dependency-name: "kysely"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      - dependency-name: "better-auth"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@better-auth/*"
        update-types: ["version-update:semver-major"]
      # GraphQL majors need a Payload-compatible schema/runtime migration.
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
      - dependency-name: "payload"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@payloadcms/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tailwindcss/*"
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------
  # Current Cloud Run invoicing container base images.
  # This updates FROM images only; it cannot parse the package.json heredoc in
  # the Dockerfile. That runtime dependency duplication remains separate debt.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "docker"
    directory: "/apps/invoicing"
    target-branch: "dev"
    schedule:
      interval: "cron"
      cronjob: "30 6 * * 1,3,5"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------------
  # External actions used under .github/workflows/. Action majors stay separate
  # so a breaking runtime/toolchain jump is never hidden in the routine batch.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "cron"
      cronjob: "30 6 * * 1,3,5"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
