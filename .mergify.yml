# Mergify governs PRs into dev. Environment refs advance through promote.yml.
merge_queue:
  max_parallel_checks: 2
merge_protections_settings:
  reporting_method: check-runs
  post_comment: true
  auto_merge_conditions:
    - label = merge-ready
merge_protections:
  - name: required review and platform checks
    if:
      - base = dev
    success_conditions:
      - -draft
      - -conflict
      - "#approved-reviews-by >= 1"
      - "#changes-requested-reviews-by = 0"
      - check-success = CI Success
      - check-success = Analyze (javascript-typescript)
      - "check-success = Socket Security: Pull Request Alerts"
      - check-success = codecov/project
      - check-success = codecov/patch
queue_rules:
  - name: development
    queue_conditions:
      - base = dev
    merge_method: squash
    checks_timeout: 45 minutes
priority_rules:
  - name: emergency hotfixes
    conditions:
      - label = hotfix
    priority: 1000
  - name: security fixes
    conditions:
      - label = security
    priority: 800
  - name: dependency updates
    conditions:
      - label = dependencies
    priority: 100
pull_request_rules:
  - name: label Release Please PRs
    conditions:
      - head ~= ^release-please--
      - "label = autorelease: pending"
    actions:
      label:
        add:
          - release
  - name: label Dependabot PRs
    conditions:
      - author = dependabot[bot]
    actions:
      label:
        add:
          - dependencies
