<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Royal Glow Salon and Spa">
  <title>Royal Glow Salon &amp; Spa</title>
  <defs>
    <linearGradient id="rgFaviconGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4E09B" />
      <stop offset="100%" stop-color="#C8A961" />
    </linearGradient>
  </defs>

  <!-- Cocoa tile keeps the gold mark legible at 16px in both light and dark UI -->
  <rect width="64" height="64" rx="14" fill="#1A0F0A" />

  <g fill="url(#rgFaviconGold)">
    <!-- crown -->
    <path d="M16 30.5V17.5l8 7 8-11 8 11 8-7v13z" />
    <circle cx="16" cy="14.4" r="2.5" />
    <circle cx="32" cy="10.5" r="2.9" />
    <circle cx="48" cy="14.4" r="2.5" />
    <rect x="16" y="33" width="32" height="3.4" rx="1.7" />
    <!-- R monogram -->
    <text x="32" y="56" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700">R</text>
  </g>
</svg>
