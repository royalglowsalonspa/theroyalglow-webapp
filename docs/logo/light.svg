<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 60" width="300" height="60" role="img" aria-label="Royal Glow Salon and Spa documentation">
  <title>Royal Glow Salon &amp; Spa — Documentation</title>
  <defs>
    <linearGradient id="rgGoldLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8A961" />
      <stop offset="55%" stop-color="#A8873F" />
      <stop offset="100%" stop-color="#7D5C12" />
    </linearGradient>
  </defs>

  <!-- Emblem: gold seal ring holding a heraldic crown above the R monogram -->
  <g fill="none" stroke="url(#rgGoldLight)">
    <circle cx="30" cy="30" r="26" stroke-width="1.6" opacity="0.55" />
    <circle cx="30" cy="30" r="22.5" stroke-width="2.4" />
  </g>

  <g fill="url(#rgGoldLight)">
    <!-- crown -->
    <path d="M19.5 24.2V15.4l5.4 4.9 5.1-7.4 5.1 7.4 5.4-4.9v8.8z" />
    <circle cx="19.5" cy="13.3" r="1.55" />
    <circle cx="30" cy="10.6" r="1.75" />
    <circle cx="40.5" cy="13.3" r="1.55" />
    <rect x="19.5" y="25.6" width="21" height="2.1" rx="1.05" />
    <!-- R monogram -->
    <text x="30" y="45.6" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Iowan Old Style', serif" font-size="19" font-weight="700" letter-spacing="0.2">R</text>
  </g>

  <!-- Wordmark -->
  <text x="70" y="27.5" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18.5" font-weight="700" letter-spacing="1.5" fill="#1A0F0A">ROYAL GLOW</text>
  <text x="70.5" y="43.5" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="600" letter-spacing="3.6" fill="#7D5C12">DOCUMENTATION</text>
</svg>
